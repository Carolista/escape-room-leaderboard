spring.application.name=escape-room-back-end

# TODO 1: Spring Boot can create tables for you, but it can't create the
#  database itself. In MySQL Workbench, create an empty schema/database named
#  `escape_room`. Why does the name need to match exactly? Look at the
#  datasource URL below to see where it gets used.

# TODO 2: Create a file named `.env` in the root of this back-end project (the
#  same folder as pom.xml). Give it a value for every ${...} variable you see in
#  the "Database connection settings" below, one NAME=value per line, with no
#  quotes or spaces around the `=`. Which values come from your own MySQL
#  setup (check your Workbench connection)? Which one must match TODO 1?
#  Then think: why is it safe for .env to hold your password but not this file?
